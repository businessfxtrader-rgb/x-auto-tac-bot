name: TAC Auto Post

on:
  schedule:
    # 投稿の目標時刻は7:30 JST / 19:00 JSTだが、GitHub Actionsのスケジュール実行は
    # 数時間単位で遅延することがあるため、30分おきにチェックして
    # 「時刻が来ていて未消化の枠」があれば投稿する(tac-post.js側の判定)。
    # 該当枠が無ければ何もせず終了するので、頻度を上げてもX API側のコストは増えない。
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate and post tweet
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_ACCESS_TOKEN }}
          POSTER_ACCESS_SECRET: ${{ secrets.POSTER_ACCESS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: node tac-post.js

      - name: Commit updated state
        run: |
          git config user.name "tac-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state.json"
          git push
