name: TAC Auto Post

on:
  schedule:
    # AI投稿の目標時刻は13:00 JST(1日1回)、ドル円レート投稿は9:00 JST以降(1日1回)。
    # GitHub Actionsのスケジュール実行は数時間単位で遅延することがあるため、30分おきにチェックして
    # 「時刻が来ていて未消化の枠」があれば投稿する(各スクリプト側の判定)。
    # 該当枠が無ければ何もせず終了するので、頻度を上げてもX API側のコストは増えない。
    # (実際の起動はcron-job.orgの外部トリガー(15分おき)が主力)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      rate_dry_run:
        description: '動作確認用: ドル円レート投稿をdry-run(レート取得確認のみ・投稿しない)で実行する'
        type: boolean
        default: false

permissions:
  contents: write

# 状態ファイル(state.json / rate-state.json)の競合を防ぐため、実行は常に直列にする
concurrency:
  group: tac-bot
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate and post tweet
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_ACCESS_TOKEN }}
          POSTER_ACCESS_SECRET: ${{ secrets.POSTER_ACCESS_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: node tac-post.js

      - name: Post USD/JPY rate
        if: always()
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          POSTER_ACCESS_TOKEN: ${{ secrets.POSTER_ACCESS_TOKEN }}
          POSTER_ACCESS_SECRET: ${{ secrets.POSTER_ACCESS_SECRET }}
        run: node rate-post.js ${{ inputs.rate_dry_run && '--dry-run' || '' }}

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "tac-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json rate-state.json
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3; do
            git pull --rebase origin master && git push && exit 0
            sleep 5
          done
          exit 1
